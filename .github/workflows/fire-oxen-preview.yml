# Cartoon-style fleet render — fire_oxen film (1080x1920, 30 fps)
# Splits the film across 20 GitHub Actions runners (frame-range chunks, headless Chromium +
# SwiftShader WebGL rendering the charsys engine in work/cartoon), then concatenates the chunks
# and muxes the film's voice wav. Manual trigger only. Nothing runs on push.
# Same proven structure as vermeer-fleet.yml (v1); only the film, matrix and cache key differ.
#
# Exact N=1911 from the local init check (F.info.N; dur 63.69 s @ 30 fps). Matrix generated
# by scripts/make-matrix.mjs 1911; the assemble verify total below matches it.
name: Cartoon Fleet Preview — fire_oxen (360x640, for film sheet)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    name: chunk ${{ matrix.chunk }} (frames ${{ matrix.start }}-${{ matrix.end }})
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          # Generated by scripts/make-matrix.mjs 1911 (20 chunks, sizes 95..96).
          - {chunk: "00", start: 0, end: 95}
          - {chunk: "01", start: 96, end: 191}
          - {chunk: "02", start: 192, end: 287}
          - {chunk: "03", start: 288, end: 383}
          - {chunk: "04", start: 384, end: 479}
          - {chunk: "05", start: 480, end: 575}
          - {chunk: "06", start: 576, end: 671}
          - {chunk: "07", start: 672, end: 767}
          - {chunk: "08", start: 768, end: 863}
          - {chunk: "09", start: 864, end: 959}
          - {chunk: "10", start: 960, end: 1055}
          - {chunk: "11", start: 1056, end: 1150}
          - {chunk: "12", start: 1151, end: 1245}
          - {chunk: "13", start: 1246, end: 1340}
          - {chunk: "14", start: 1341, end: 1435}
          - {chunk: "15", start: 1436, end: 1530}
          - {chunk: "16", start: 1531, end: 1625}
          - {chunk: "17", start: 1626, end: 1720}
          - {chunk: "18", start: 1721, end: 1815}
          - {chunk: "19", start: 1816, end: 1910}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Cache node_modules and Playwright browsers
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            ~/.cache/ms-playwright
          key: cartoon-fleet-fire-oxen-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install dependencies (latest Playwright, pinned by lockfile)
        run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Ensure ffmpeg
        run: command -v ffmpeg >/dev/null || (sudo apt-get update && sudo apt-get install -y ffmpeg)
      - name: Render chunk ${{ matrix.chunk }}
        env:
          FILM_BASE: /work/cartoon/examples/fire_oxen/
          FILM_FILE: film.json
          W: "360"
          H: "640"
        run: |
          mkdir -p "$GITHUB_WORKSPACE/chunks"
          node scripts/render-chunk.mjs ${{ matrix.start }} ${{ matrix.end }} "$GITHUB_WORKSPACE/chunks/chunk-${{ matrix.chunk }}.mp4"
      - uses: actions/upload-artifact@v4
        with:
          name: chunk-${{ matrix.chunk }}
          path: chunks/chunk-${{ matrix.chunk }}.mp4
          if-no-files-found: error

  assemble:
    name: assemble preview.mp4
    needs: render
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Ensure ffmpeg
        run: command -v ffmpeg >/dev/null || (sudo apt-get update && sudo apt-get install -y ffmpeg)
      - uses: actions/download-artifact@v4
        with:
          path: chunks
          pattern: chunk-*
          merge-multiple: true
      - name: Verify chunk count and frame counts
        run: |
          ls chunks/
          test "$(ls chunks/chunk-*.mp4 | wc -l)" = "20"
          total=0
          for f in chunks/chunk-*.mp4; do
            n=$(ffprobe -v error -select_streams v:0 -count_frames -show_entries stream=nb_read_frames -of csv=p=0 "$f" | tr -dc '0-9')
            echo "$f frames=$n"
            total=$((total + n))
          done
          echo "TOTAL FRAMES: $total"
          # Must equal the exact N used for the matrix above.
          test "$total" = "1911"
      - name: Concatenate and mux voice
        run: |
          for f in $(ls chunks/chunk-*.mp4 | sort); do echo "file '$PWD/$f'"; done > concat.txt
          ffmpeg -y -f concat -safe 0 -i concat.txt -c copy video.mp4
          cp video.mp4 preview.mp4
          ffprobe -v error -show_entries format=duration,size -show_entries stream=codec_name,width,height,r_frame_rate,nb_frames -of default=noprint_wrappers=1 preview.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: preview
          path: preview.mp4
          if-no-files-found: error
