# Cartoon-style fleet render — vermeer_forger film (1080x1920, 30 fps)
# Splits the film across 20 GitHub Actions runners (frame-range chunks, headless Chromium +
# SwiftShader WebGL rendering the charsys engine in work/cartoon), then concatenates the chunks
# and muxes the film's voice wav. Manual trigger only. Nothing runs on push.
# Same proven structure as cartoon-fleet.yml (backrooms); only the film, matrix and cache key differ.
#
# Exact N=2286 from the local init check (F.info.N; dur 76.20 s @ 30 fps). Matrix generated
# by scripts/make-matrix.mjs 2286; the assemble verify total below matches it.
name: Cartoon Fleet Render — vermeer_forger (v1)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    name: chunk ${{ matrix.chunk }} (frames ${{ matrix.start }}-${{ matrix.end }})
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          # Generated by scripts/make-matrix.mjs 2286 (20 chunks, sizes 114..115).
          - {chunk: "00", start: 0, end: 114}
          - {chunk: "01", start: 115, end: 229}
          - {chunk: "02", start: 230, end: 344}
          - {chunk: "03", start: 345, end: 459}
          - {chunk: "04", start: 460, end: 574}
          - {chunk: "05", start: 575, end: 689}
          - {chunk: "06", start: 690, end: 803}
          - {chunk: "07", start: 804, end: 917}
          - {chunk: "08", start: 918, end: 1031}
          - {chunk: "09", start: 1032, end: 1145}
          - {chunk: "10", start: 1146, end: 1259}
          - {chunk: "11", start: 1260, end: 1373}
          - {chunk: "12", start: 1374, end: 1487}
          - {chunk: "13", start: 1488, end: 1601}
          - {chunk: "14", start: 1602, end: 1715}
          - {chunk: "15", start: 1716, end: 1829}
          - {chunk: "16", start: 1830, end: 1943}
          - {chunk: "17", start: 1944, end: 2057}
          - {chunk: "18", start: 2058, end: 2171}
          - {chunk: "19", start: 2172, end: 2285}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Cache node_modules and Playwright browsers
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            ~/.cache/ms-playwright
          key: cartoon-fleet-vermeer-v1-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install dependencies (latest Playwright, pinned by lockfile)
        run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Ensure ffmpeg
        run: command -v ffmpeg >/dev/null || (sudo apt-get update && sudo apt-get install -y ffmpeg)
      - name: Render chunk ${{ matrix.chunk }}
        env:
          FILM_BASE: /work/cartoon/examples/vermeer_forger/
          FILM_FILE: film.json
          # FPS/W/H intentionally left at render-chunk.mjs defaults (30 / 1080 / 1920).
        run: |
          mkdir -p "$GITHUB_WORKSPACE/chunks"
          node scripts/render-chunk.mjs ${{ matrix.start }} ${{ matrix.end }} "$GITHUB_WORKSPACE/chunks/chunk-${{ matrix.chunk }}.mp4"
      - uses: actions/upload-artifact@v4
        with:
          name: chunk-${{ matrix.chunk }}
          path: chunks/chunk-${{ matrix.chunk }}.mp4
          if-no-files-found: error

  assemble:
    name: assemble final.mp4
    needs: render
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Ensure ffmpeg
        run: command -v ffmpeg >/dev/null || (sudo apt-get update && sudo apt-get install -y ffmpeg)
      - uses: actions/download-artifact@v4
        with:
          path: chunks
          pattern: chunk-*
          merge-multiple: true
      - name: Verify chunk count and frame counts
        run: |
          ls chunks/
          test "$(ls chunks/chunk-*.mp4 | wc -l)" = "20"
          total=0
          for f in chunks/chunk-*.mp4; do
            n=$(ffprobe -v error -select_streams v:0 -count_frames -show_entries stream=nb_read_frames -of csv=p=0 "$f" | tr -dc '0-9')
            echo "$f frames=$n"
            total=$((total + n))
          done
          echo "TOTAL FRAMES: $total"
          # Must equal the exact N used for the matrix above.
          test "$total" = "2286"
      - name: Concatenate and mux voice
        run: |
          for f in $(ls chunks/chunk-*.mp4 | sort); do echo "file '$PWD/$f'"; done > concat.txt
          ffmpeg -y -f concat -safe 0 -i concat.txt -c copy video.mp4
          ffmpeg -y -i video.mp4 -i work/cartoon/examples/vermeer_forger/voice/vo.wav -c:v copy -c:a aac -b:a 192k final.mp4
          ffprobe -v error -show_entries format=duration,size -show_entries stream=codec_name,width,height,r_frame_rate,nb_frames -of default=noprint_wrappers=1 final.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: final
          path: final.mp4
          if-no-files-found: error
